backend:
  name: github
  repo: iYangJike/iYangJike.github.io
  branch: main
  base_url: https://decap-oauth-vercel-seven.vercel.app
  client_id: Ov23liX8k2rOOZ7wHTnx
  skip_ci: false

# 自定义品牌
logo:
  src: /lorelei-1787569163246.svg
  show_in_header: false
app_title: iYangJike admin
site_url: https://iyangjike.github.io

media_folder: src/content/posts/images
public_folder: /images

collections:
  # 标签管理（统一管理，写文章时下拉选择）
  - name: tags
    label: 标签
    label_singular: 标签
    folder: src/content/tags
    create: true
    slug: '{{slug}}'
    identifier_field: title
    editor:
      preview: false
    fields:
      - label: 标签名
        name: title
        widget: string
        hint: 标签显示名称，如 "Astro"、"Web3"

  # 系列管理（统一管理，写文章时下拉选择）
  - name: series
    label: 系列
    label_singular: 系列
    folder: src/content/series
    create: true
    slug: '{{slug}}'
    identifier_field: title
    editor:
      preview: false
    fields:
      - label: 系列名
        name: title
        widget: string
      - label: 描述
        name: description
        widget: text
        required: false
      - label: 封面图
        name: image
        widget: image
        required: false

  # 博客文章
  - name: posts
    label: 博客文章
    label_singular: 文章
    folder: src/content/posts
    path: '{{slug}}/index'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: posts/{{slug}}
    sortable_fields:
      fields: [title, published]
      default:
        field: published
        direction: descending
    editor:
      preview: false
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
      - label: 摘要
        name: description
        widget: text
        required: false
      - label: 标签
        name: tags
        widget: relation
        collection: tags
        value_field: title
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - label: 系列
        name: series
        widget: relation
        collection: series
        value_field: title
        search_fields: [title]
        display_fields: [title]
        required: false
      - label: 显示目录
        name: toc
        widget: boolean
        default: true
        required: false
      - label: 封面图
        name: coverImage
        widget: object
        required: false
        fields:
          - label: 图片
            name: src
            widget: image
            required: false
          - label: 替代文本
            name: alt
            widget: string
            required: false
      - label: 正文
        name: body
        widget: markdown

  - name: pages
    label: 页面
    files:
      - label: 首页
        name: home
        file: src/content/home.md
        fields:
          - label: 头像
            name: avatarImage
            widget: object
            fields:
              - label: 图片
                name: src
                widget: image
                required: false
              - label: 替代文本
                name: alt
                widget: string
                required: false
          - label: GitHub 用户名
            name: githubCalendar
            widget: string
            required: false
          - label: 正文
            name: body
            widget: markdown

      - label: 文章附言
        name: addendum
        file: src/content/addendum.md
        fields:
          - label: 头像
            name: avatarImage
            widget: object
            fields:
              - label: 图片
                name: src
                widget: image
                required: false
              - label: 替代文本
                name: alt
                widget: string
                required: false
          - label: 正文
            name: body
            widget: markdown

      - label: 关于页面
        name: about
        file: src/pages/about.md
        fields:
          - label: 标题
            name: title
            widget: string
          - label: 正文
            name: body
            widget: markdown

      - label: 在线简历
        name: resume
        file: src/data/resume.json
        fields:
          - label: 基本信息
            name: basics
            widget: object
            fields:
              - label: 姓名
                name: name
                widget: string
              - label: 职位
                name: headline
                widget: string
              - label: 网站
                name: website
                widget: string
                required: false
              - label: 网站显示名
                name: website_label
                widget: string
                required: false
          - label: 个人总结
            name: summary
            widget: text
          - label: 工作经历
            name: experience
            widget: list
            fields:
              - label: 公司
                name: company
                widget: string
              - label: 职位
                name: position
                widget: string
              - label: 简介
                name: intro
                widget: string
                required: false
              - label: 详情
                name: details
                widget: list
                field:
                  label: 条目
                  name: detail
                  widget: string
          - label: 项目经历
            name: projects
            widget: list
            fields:
              - label: 项目名
                name: name
                widget: string
              - label: 简介
                name: intro
                widget: string
                required: false
              - label: 详情
                name: details
                widget: list
                field:
                  label: 条目
                  name: detail
                  widget: string
          - label: 技能
            name: skills
            widget: list
            field:
              label: 技能
              name: skill
              widget: string
          - label: 教育经历
            name: education
            widget: list
            fields:
              - label: 学校
                name: school
                widget: string
              - label: 学历
                name: degree
                widget: string
              - label: 专业
                name: field
                widget: string

      - label: 导航栏设置
        name: nav
        file: src/data/nav.json
        fields:
          - label: 导航项
            name: nav_items
            widget: list
            fields:
              - label: 名称
                name: name
                widget: string
              - label: 链接
                name: url
                widget: string
              - label: 外链
                name: external
                widget: boolean
                default: false
                required: false
              - label: 显示
                name: enabled
                widget: boolean
                default: true

locale: zh_CN
